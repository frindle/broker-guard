# broker-guard -- a scheduled/looping job by default. Nothing is published
# unless BG_SERVE_WEB is turned on below, in which case the SAME container
# also serves a web dashboard (see broker_guard/webapp.py for why this is
# one process/one container rather than two).
#
# Deployment note: IP / MAC / network placement is deliberately NOT decided here.
# Plain bridge networking is used below; see the commented `macvlan` block at the
# bottom for where a static homelab IP would be wired in.

services:
  broker-guard:
    build:
      context: .
      args:
        # false -> much smaller image, SERP-only detection (no Chromium).
        INSTALL_BROWSERS: "true"
    image: broker-guard:local
    container_name: broker-guard
    restart: unless-stopped
    # network_mode: bridge   # <- default. Mutually exclusive with `networks:` below --
    # if you uncomment the macvlan `networks:` block at the bottom of this file (or
    # supply it via docker-compose.override.yml), this line MUST stay commented out;
    # Compose rejects a service that sets both.
    #
    # DO NOT UNCOMMENT THAT LINE WITHOUT READING THIS. It is not just a
    # networking preference any more. The Proton Mail Bridge runs as its own
    # container on this host (installed from the Unraid Community Apps
    # template) and it listens on IMAP:143 inside that container whether or
    # not a host port is published to it -- publishing governs access from the
    # HOST, not traffic between containers. Leaving this commented out is what
    # keeps broker-guard on its own private Compose network, where Docker's
    # inter-network isolation means it cannot reach that IMAP port at all.
    # `network_mode: bridge` would put it on docker0 beside the Bridge and end
    # that, silently. broker-guard is SMTP-send-only; see the header of
    # broker_guard/smtp_transport.py. tests/test_compose_bridge.py fails if
    # this changes.

    # Reach services published on the HOST (currently: the Proton Mail Bridge's
    # SMTP port) by the name host.docker.internal, from our own network. This
    # is the standard alias and is safe regardless of what SMTP host value is
    # eventually configured -- it grants a route to the host's published ports,
    # which is exactly the asymmetry we want, since the Bridge's IMAP port is
    # deliberately left unpublished and so has nothing to route to.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Only meaningful when BG_SERVE_WEB=true below. If nothing binds
    # BG_WEB_PORT inside the container (the default), publishing it exposes
    # nothing -- but comment this block out entirely if you want zero
    # published ports on principle, full stop.
    ports:
      - "${BG_WEB_PORT:-8000}:${BG_WEB_PORT:-8000}"

    volumes:
      # PERSISTENT STATE + PII. None of this is baked into the image; all of it
      # is gitignored and dockerignored. Back it up like you would a password DB.
      #   ./state/profile.local.json  <- your identity (copy profile.example.json)
      #   ./state/brokers.json        <- broker dataset; auto-generated from the
      #                                  bundled public dataset on first boot if
      #                                  absent -- see broker_normalize.ensure_brokers_file.
      #                                  Supply your own here first if you don't want that.
      #   ./state/state.sqlite        <- presence history
      #   ./state/id_documents/       <- encrypted ID-document uploads (web UI only)
      #   ./state/freeze_state.json   <- credit-freeze tracker state (web UI only)
      - ./state:/data
      # Structured JSON logs, alert digests and the heartbeat file.
      - ./logs:/logs
      # eraser's own identity/config only -- the eraser BINARY itself is now
      # built into the image (see Dockerfile's eraser-builder stage), so
      # there is no host-side `go build` step and no binary volume mount
      # anymore.
      - ./state/eraser-config:/home/guard/.eraser:ro

    environment:
      # =====================================================================
      # SETTINGS THAT ARE NOW EDITABLE IN THE WEB UI (/settings)
      # =====================================================================
      # BG_PLAYWRIGHT_ENABLED, BG_SEARXNG_URL, BG_SEARXNG_MIN_INTERVAL_S,
      # BG_SEARXNG_JITTER_S, BG_ALERT_WEBHOOK_URL, BG_ERASER_ENABLED,
      # BG_ERASER_DRY_RUN, BG_OPTOUT_SUBMIT_ENABLED, BG_OPTOUT_SUBMIT_DRY_RUN,
      # BG_CAPTCHA_API_KEY and BG_INTERVAL_SECONDS are all
      # still read from here -- but only as the FALLBACK tier. Precedence is:
      #
      #     saved in /data/settings.json  >  the variable below  >  the
      #     built-in default in broker_guard/config.py
      #
      # Change them on the dashboard's Settings page instead of editing this
      # file. An edit made here is reverted by the next redeploy (the host
      # runs `git fetch && git reset --hard origin/main && docker compose
      # build && docker compose up -d`, and this file is tracked) -- which is
      # the actual root cause of the recurring "the web UI turned itself off
      # again" / "Playwright detection turned itself off again" reports. A
      # value saved on /settings lives on the /data volume and survives.
      #
      # BG_SERVE_WEB is the ONE exception and stays env-only on purpose: if it
      # is false there is no running web UI in which to expose a toggle for
      # it. Put that one in `.env` (see below).
      # =====================================================================

      # --- paths (match the volumes above; defaults already set in the image) ---
      BG_PROFILE_PATH: /data/profile.local.json
      BG_BROKERS_PATH: /data/brokers.json
      BG_STATE_PATH: /data/state.sqlite
      BG_LOG_DIR: /logs
      BG_ID_DOCUMENTS_DIR: /data/id_documents
      BG_FREEZE_STATE_PATH: /data/freeze_state.json
      # exposure.py/profiles.py were added after this block and never got the
      # same treatment -- their config.py defaults are bare relative paths
      # (correct for local/non-Docker use), which resolve under /app here and
      # hit this container's read_only:true root fs ("[Errno 30] Read-only
      # file system" on every write). Same fix as every path above: pin it
      # onto the writable /data volume explicitly.
      BG_EXPOSURE_CACHE_PATH: /data/exposure_cache.json
      BG_PROFILES_PATH: /data/profiles.json
      # The UI-editable settings store -- see broker_guard/settings.py and the
      # "SETTINGS THAT ARE NOW EDITABLE IN THE WEB UI" note below. On the /data
      # volume with everything else persistent, so `git reset --hard` on a
      # redeploy cannot touch it. This path itself is env-only: a store cannot
      # relocate itself from inside its own UI.
      BG_SETTINGS_PATH: /data/settings.json
      # The opt-out SUBMISSION audit trail (broker_guard/review.py): one JSON
      # record + one screenshot per attempt. On /data so it survives the
      # `git reset --hard` redeploy -- an audit trail that evaporates is not
      # an audit trail. Env-only, like every other path here.
      BG_REVIEW_DIR: /data/review

      # --- web dashboard (off by default -- headless loop only) ---
      # Set true to serve broker_guard/webui.py + run the autopilot loop as
      # a background thread in this same container (see broker_guard/webapp.py).
      # Env-substituted (not a bare literal) so a persistent, gitignored `.env`
      # can override it -- otherwise every `git reset --hard` on redeploy wipes
      # a manual edit made directly to this tracked file back to "false" (the
      # recurring "no webui" report). Put `BG_SERVE_WEB=true` in `.env` instead.
      BG_SERVE_WEB: "${BG_SERVE_WEB:-false}"
      BG_WEB_PORT: "8000"
      # Required for the ID-document-upload and credit-freeze-PIN routes
      # ONLY (encrypts them at rest) -- everything else works with this
      # unset. Generate one with:
      #   python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      BG_CRYPTO_KEY: "${BG_CRYPTO_KEY:-}"

      # --- scheduling ---
      # UI-editable (/settings). Takes effect at the autopilot loop's next
      # tick -- it does not interrupt a sleep already in progress. One sweep
      # per day; minimum accepted is 60, enforced on the stored value too.
      BG_INTERVAL_SECONDS: "${BG_INTERVAL_SECONDS:-86400}"
      BG_RUN_ONCE: "false"

      # --- SearXNG (self-hosted; REQUIRED for SERP detection) ---
      # UI-editable (/settings); live from the next autopilot scan cycle.
      # Point this at YOUR instance. Leave unset to disable SERP detection.
      BG_SEARXNG_URL: "${BG_SEARXNG_URL:-}"
      BG_SEARXNG_TIMEOUT_S: "20"
      # Optional Authorization header value if your SearXNG sits behind auth.
      BG_SEARXNG_AUTH: "${BG_SEARXNG_AUTH:-}"
      # Pacing: minimum seconds between two SearXNG requests, plus a uniform
      # 0..JITTER on top. A full cycle is ~827 brokers x one query per
      # identity value -- thousands of requests. Unpaced, they went out as
      # fast as RTT allowed and got the instance's UPSTREAM engines (Brave,
      # Google CSE, DuckDuckGo, Startpage, Wikipedia) rate-limited and
      # CAPTCHA-walled, which can take up to ~2 weeks to clear. At 2-3s a
      # request a full sweep takes hours -- which is fine, the default scan
      # interval is a day. Do not lower these to "speed up" a scan.
      BG_SEARXNG_MIN_INTERVAL_S: "${BG_SEARXNG_MIN_INTERVAL_S:-2.0}"
      BG_SEARXNG_JITTER_S: "${BG_SEARXNG_JITTER_S:-1.0}"

      # --- browser checks ---
      # UI-editable (/settings); live from the next autopilot scan cycle --
      # that is now the preferred way to turn this on, and the one that
      # survives a redeploy. The `${...}` substitution + gitignored `.env`
      # fallback below is KEPT as the env tier (it is still how you preseed
      # the value before the UI has ever been opened), it is simply no longer
      # the only way to set it. Requires INSTALL_BROWSERS=true at build time
      # above, which is already the default in this file.
      BG_PLAYWRIGHT_ENABLED: "${BG_PLAYWRIGHT_ENABLED:-false}"
      BG_PLAYWRIGHT_HEADLESS: "true"
      BG_PLAYWRIGHT_TIMEOUT_MS: "30000"

      # --- removal engine ---
      # Both UI-editable (/settings); live from the next autopilot scan cycle.
      # Disabled by default, and DRY RUN by default even once enabled, so no
      # opt-out request is ever sent until you deliberately turn both off.
      BG_ERASER_ENABLED: "${BG_ERASER_ENABLED:-false}"
      BG_ERASER_DRY_RUN: "${BG_ERASER_DRY_RUN:-true}"
      BG_ERASER_BIN: /opt/eraser/bin/eraser
      BG_ERASER_TIMEOUT_S: "300"

      # --- automated opt-out form submission (broker_guard/optout_submit.py) ---
      # THE one feature here with real third-party side effects: it fills in
      # your actual name, email and state on a broker's webform and, fully
      # switched on, presses Submit unattended.
      #
      # Both UI-editable (/settings), both defaulting to the safe end, and
      # they are two separate switches on purpose -- neither one alone can
      # cause a real submission:
      #
      #   BG_OPTOUT_SUBMIT_ENABLED=false -> the feature does not run at all.
      #     It is deliberately NOT part of the autopilot scan loop; a scan
      #     never submits anything. Runs are started by hand from /review.
      #   BG_OPTOUT_SUBMIT_DRY_RUN=true  -> even once enabled, the form is
      #     filled and screenshotted but Submit is never pressed.
      #
      # Also requires BG_PLAYWRIGHT_ENABLED and a browser in the image
      # (INSTALL_BROWSERS=true, the default). Only brokers with a
      # hand-verified recipe in broker_guard/optout_forms.py are eligible.
      BG_OPTOUT_SUBMIT_ENABLED: "${BG_OPTOUT_SUBMIT_ENABLED:-false}"
      BG_OPTOUT_SUBMIT_DRY_RUN: "${BG_OPTOUT_SUBMIT_DRY_RUN:-true}"

      # --- opt-out by email (broker_guard/optout_email.py) ---
      # The same two-switch interlock as the form path above, for a reason
      # that is arguably stronger: email cannot be recalled. Default is
      # draft-only, where prepare_draft builds a mailto: the human opens,
      # reads and sends from their own client.
      #
      #   BG_OPTOUT_EMAIL_ENABLED=false -> the feature does not run.
      #   BG_OPTOUT_EMAIL_DRY_RUN=true  -> even enabled, the message is
      #     composed and recorded but never handed to a transport.
      #
      # Neither flag can widen WHO gets written to. optout_email's
      # eligibility check -- the broker's own domain, a role local-part --
      # runs inside both compose_request and send_request and is not
      # overridable by any flag or env var.
      BG_OPTOUT_EMAIL_ENABLED: "${BG_OPTOUT_EMAIL_ENABLED:-false}"
      BG_OPTOUT_EMAIL_DRY_RUN: "${BG_OPTOUT_EMAIL_DRY_RUN:-true}"

      # The From: address -- a dedicated Proton alias, not a primary inbox.
      # Left EMPTY here on purpose: this file is tracked, and the address is
      # Penn's to set in the gitignored .env once he has confirmed it.
      BG_OPTOUT_EMAIL_FROM: "${BG_OPTOUT_EMAIL_FROM:-}"

      # --- SMTP transport for the above (broker_guard/smtp_transport.py) ---
      # SEND ONLY. There is no IMAP/POP client in this codebase, no setting
      # for one, and no feature that needs one -- nothing reads replies.
      # Read that module's header before adding anything that would.
      #
      # Host is empty until the Bridge container is up and its published port
      # is known; empty means no transport is built, so a live send has
      # nothing to hand a message to and fails loudly rather than silently.
      # Reach it via host.docker.internal (see extra_hosts above).
      #
      # USERNAME/PASSWORD are Bridge-generated and are NOT the Proton account
      # password. Like BG_CRYPTO_KEY they belong in .env and must never be
      # written literally here; a test enforces that.
      BG_OPTOUT_EMAIL_SMTP_HOST: "${BG_OPTOUT_EMAIL_SMTP_HOST:-}"
      BG_OPTOUT_EMAIL_SMTP_PORT: "${BG_OPTOUT_EMAIL_SMTP_PORT:-1025}"
      BG_OPTOUT_EMAIL_SMTP_USERNAME: "${BG_OPTOUT_EMAIL_SMTP_USERNAME:-}"
      BG_OPTOUT_EMAIL_SMTP_PASSWORD: "${BG_OPTOUT_EMAIL_SMTP_PASSWORD:-}"
      # The Bridge's certificate is self-signed. Point this at its exported
      # CA (mounted read-only) so verification stays ON -- that is the
      # supported path. BG_OPTOUT_EMAIL_SMTP_INSECURE_TLS exists only as a
      # bench-test hatch and is REFUSED for any host that is not
      # container-local, so it cannot follow this config into production.
      BG_OPTOUT_EMAIL_SMTP_CA_FILE: "${BG_OPTOUT_EMAIL_SMTP_CA_FILE:-}"

      # --- alerting ---
      # UI-editable (/settings); live from the next autopilot cycle.
      # Optional. Your own webhook (Home Assistant, ntfy, ...). Unset = file only.
      BG_ALERT_WEBHOOK_URL: "${BG_ALERT_WEBHOOK_URL:-}"
      BG_ALERT_LOG_PATH: /logs/alerts.jsonl

      # --- captcha solving (third-party service; optional) ---
      # UI-editable (/settings), where it is write-only: the stored value is
      # never rendered back into the page, same rule as the credit-freeze PIN.
      BG_CAPTCHA_API_KEY: "${BG_CAPTCHA_API_KEY:-}"

      # --- logging ---
      BG_LOG_LEVEL: INFO
      BG_MAX_RETRIES: "3"
      # Leave FALSE. True disables the PII redaction in the logs.
      BG_LOG_PII: "false"

      TZ: "${TZ:-UTC}"

    # Hardening: this process needs no privileges and writes only to its volumes.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# ---------------------------------------------------------------------------
# HOMELAB NETWORKING -- default network_mode above is commented out, so a
# plain per-project bridge network is used unless you override it.
#
# For a static LAN IP (macvlan) on Unraid, do NOT edit this file per-deploy --
# drop a docker-compose.override.yml next to this file instead (merged
# automatically by `docker compose`), e.g.:
#
#   services:
#     broker-guard:
#       networks:
#         lan:
#           ipv4_address: 10.0.x.x    # <- the static IP you want (verify free first)
#           mac_address: 02:xx:xx:xx:xx:xx  # locally-administered MAC, must be unique
#   networks:
#     lan:
#       driver: macvlan
#       driver_opts:
#         parent: br0             # <- Unraid's host bridge (not eth0)
#       ipam:
#         config:
#           - subnet: 10.0.0.0/20  # <- your subnet
#             gateway: 10.0.0.1    # <- your gateway
#
# Do NOT also set `network_mode:` on the service above when using this --
# Compose rejects a service that declares both `network_mode` and `networks`.
# ---------------------------------------------------------------------------
